name: Sweetkey
options:
  bundleIdPrefix: com.sweet
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Sweetkey:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweet.sweetkey
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    entitlements:
      path: App/Sweetkey.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sweet.customkeyboard
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sweetkey
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "Sweetkey ভয়েস টাইপিংয়ের জন্য আপনার মাইক্রোফোন ব্যবহার করে।"
        NSSpeechRecognitionUsageDescription: "Sweetkey আপনার কথাকে টেক্সটে রূপান্তর করতে Apple Speech Recognition ব্যবহার করে।"
        CFBundleURLTypes:
          - CFBundleURLName: com.sweet.sweetkey
            CFBundleURLSchemes:
              - sweetkey
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: CustomKeyboardExt
        embed: true

  CustomKeyboardExt:
    type: app-extension
    platform: iOS
    sources:
      - path: CustomKeyboardExt
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweet.sweetkey.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: CustomKeyboardExt/CustomKeyboardExt.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sweet.customkeyboard
    info:
      path: CustomKeyboardExt/Info.plist
      properties:
        CFBundleDisplayName: Sweetkey Keyboard
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: bn
            RequestsOpenAccess: true
            SupportedLanguages:
              - bn
              - en-US
